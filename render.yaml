services:
  - type: web
    name: resumeiq-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: resumeiq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false           # Set this manually in Render dashboard to your Vercel URL
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false           # Set this manually in Render dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: APP_STORAGE_DIRECTORY
        value: /tmp/resumeiq-storage
      - key: APP_UPLOAD_MAX_SIZE
        value: 10MB
      - key: FLYWAY_ENABLED
        value: "true"

databases:
  - name: resumeiq-db
    plan: free
    databaseName: resumeiq
    user: resumeiq
